openapi: 3.0.2
info:
  title: API Liga de Aventureros Vigo
  version: "0.1"
  description: Documentación de la API REST de Liga de Aventureros Vigo.

servers:
  - url: /v1
    description: Servidor principal

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CronApiKey:
      type: apiKey
      in: query
      name: key

tags:
  - name: Public
  - name: Authentication
  - name: User
  - name: Admin
  - name: Cron

paths:

  /social-links:
    get:
      tags: [Public]
      summary: Enlaces sociales públicos
      description: Devuelve, si existen, los settings `instagram`, `whatsapp` y `kofi`.
      responses:
        "200":
          description: OK

  /login:
    post:
      tags: [Authentication]
      summary: Login con email y contraseña
      description: Autentica al usuario con email y contraseña y devuelve el JWT de la API.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user, password]
              properties:
                user:
                  type: string
                  example: usuario@dominio.com
                password:
                  type: string
                  example: "********"
      responses:
        "200":
          description: Login correcto

  /login/google:
    get:
      tags: [Authentication]
      summary: Obtener Google Client ID
      description: Devuelve el google_client_id configurado en el servidor.
      responses:
        "200":
          description: OK
    post:
      tags: [Authentication]
      summary: Login con Google
      description: Valida el id_token de Google, crea/recupera el usuario y devuelve JWT de la API.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  example: eyJhbGciOiJSUzI1NiIs
      responses:
        "200":
          description: Login correcto

  /login/admin:
    post:
      tags: [Authentication]
      summary: Login como admin
      description: Permite a un admin autenticarse como otro usuario y obtener su JWT. Requiere JWT de un usuario admin.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
      responses:
        "200":
          description: OK

  /me:
    get:
      tags: [User]
      summary: Usuario autenticado
      description: Devuelve los datos del usuario logeado usando el JWT del header Authorization.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /update-settings:
    post:
      tags: [User]
      summary: Actualizar ajustes del usuario autenticado
      description: Actualiza de forma parcial `name`, `password` y/o `avatar` del usuario autenticado. Los tres campos son opcionales, pero la petición debe incluir al menos uno. Si `avatar` supera 256px en ancho o alto, el servidor lo redimensiona manteniendo proporción.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Juan Aventurero
                password:
                  type: string
                  example: "mi_password_segura"
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida (sin campos, avatar inválido o datos no válidos)
        "401":
          description: No autorizado
        "500":
          description: Error interno del servidor

  /delete-user:
    delete:
      tags: [User]
      summary: Programar eliminación de cuenta
      description: Programa la eliminación de la cuenta del usuario autenticado estableciendo `delete_on` a 15 días desde la fecha actual. No recibe parámetros.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Eliminación programada correctamente
        "401":
          description: No autorizado
        "500":
          description: Error interno del servidor

  /admin/control-panel:
    get:
      tags: [Admin]
      summary: Panel de control (admin)
      description: Devuelve los contadores de usuarios para el panel de navegación y estadísticas básicas del log de ficheros.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /admin/user-list:
    post:
      tags: [Admin]
      summary: Listado de usuarios (admin)
      description: Devuelve un listado paginado de usuarios con orden y búsqueda opcional.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 20
                order_by:
                  type: string
                  example: date_created
                order_dir:
                  type: string
                  example: desc
                q:
                  type: string
                  example: ""
      responses:
        "200":
          description: OK

  /admin/user/{uid}:
    get:
      tags: [Admin]
      summary: Detalle de usuario (admin)
      description: Devuelve los datos de un usuario y su historial de bans.
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: ABC123DEF45
      responses:
        "200":
          description: OK

  /admin/ban-user:
    post:
      tags: [Admin]
      summary: Banear usuario (admin)
      description: Registra un ban para un usuario. El campo banned_by se extrae del JWT del admin autenticado y date_start se establece automÃ¡ticamente al recibir la peticiÃ³n.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, permanent, reason]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                permanent:
                  type: integer
                  example: 1
                date_end:
                  type: string
                  example: "2026-05-01 12:00:00"
                reason:
                  type: string
                  example: Incumplimiento de normas
      responses:
        "200":
          description: OK

  /admin/unban/{uid}:
    get:
      tags: [Admin]
      summary: Desbanear usuario (admin)
      description: Desbanea a un usuario poniendo todos sus bans activos a permanente=0 y date_end a la fecha-hora actual.
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: ABC123DEF45
      responses:
        "200":
          description: OK

  /admin/toggle-admin:
    post:
      tags: [Admin]
      summary: Toggle admin (admin)
      description: Activa o desactiva el rol admin de un usuario. No permite modificar tus propios permisos de admin ni activar admin a usuarios no verificados.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, state]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                state:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK

  /admin/toggle-master:
    post:
      tags: [Admin]
      summary: Toggle master (admin)
      description: Activa o desactiva el rol master de un usuario. No permite activar master a usuarios no verificados.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, state]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                state:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK

  /admin/settings/get:
    get:
      tags: [Admin]
      summary: Obtener settings (admin)
      description: Devuelve la lista completa de settings del sistema.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /admin/settings/update:
    post:
      tags: [Admin]
      summary: Actualizar setting (admin)
      description: Actualiza el valor de una setting existente identificada por su clave.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: test
                value:
                  type: string
                  example: abc123
      responses:
        "200":
          description: OK

  /admin/upload-log:
    post:
      tags: [Admin]
      summary: Listado de subidas (admin)
      description: Devuelve un listado paginado del log de subidas con orden, búsqueda y filtros opcionales por usuario y rango de fechas.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 20
                order_by:
                  type: string
                  example: timestamp
                order_dir:
                  type: string
                  example: desc
                q:
                  type: string
                  example: ""
                user_uid:
                  type: string
                  example: ""
                date_from:
                  type: string
                  description: Fecha mínima del rango en formato YYYY-MM-DD.
                date_to:
                  type: string
                  description: Fecha máxima del rango en formato YYYY-MM-DD.
      responses:
        "200":
          description: OK

  /cron/delete-users-by-request:
    get:
      tags: [Cron]
      summary: Eliminar usuarios con baja programada
      description: Elimina todos los usuarios cuya fecha `delete_on` sea hoy o anterior.
      security:
        - CronApiKey: []
      responses:
        "200":
          description: OK
        "401":
          description: API key inválida o ausente
        "500":
          description: Error interno del servidor

  /cron/delete-unused-avatars:
    get:
      tags: [Cron]
      summary: Eliminar avatares sin uso
      description: Elimina archivos de `avatar` no asociados a ningun usuario.
      security:
        - CronApiKey: []
      responses:
        "200":
          description: OK
        "401":
          description: API key inválida o ausente
        "500":
          description: Error interno del servidor
