openapi: 3.0.2
info:
  title: API Liga de Aventureros Vigo
  version: "0.1"
  description: Documentación de la API REST de Liga de Aventureros Vigo.

servers:
  - url: /v1
    description: Servidor principal

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CronApiKey:
      type: apiKey
      in: query
      name: key

tags:
  - name: Public
  - name: Authentication
  - name: User
  - name: Admin
  - name: Game Systems
  - name: Cron

paths:

  /social-links:
    get:
      tags: [Public]
      summary: Enlaces sociales públicos
      description: Devuelve, si existen, los settings `instagram`, `whatsapp` y `kofi`.
      responses:
        "200":
          description: OK

  /game-systems:
    get:
      tags: [Game Systems]
      summary: Listado de sistemas de juego
      description: Devuelve todos los sistemas de juego disponibles
      responses:
        "200":
          description: OK

  /game-systems/{slug}:
    get:
      tags: [Game Systems]
      summary: Detalle de un sistema de juego
      description: Devuelve los datos de un sistema de juego identificado por su slug.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: dnd
      responses:
        "200":
          description: OK
        "404":
          description: Sistema no encontrado

  /game-systems/add:
    post:
      tags: [Game Systems]
      summary: Añadir sistema de juego
      description: Crea un nuevo sistema de juego. Si se envía `icon`, debe ser una imagen (jpeg, png, webp o gif); se redimensiona a 128px si supera ese tamaño.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  example: Pathfinder
                slug:
                  type: string
                  example: pathfinder
                active:
                  type: integer
                  enum: [0, 1]
                  default: 1
                  description: 1 activo, 0 inactivo. Por defecto 1.
                icon:
                  type: string
                  format: binary
      responses:
        "201":
          description: Sistema creado
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "409":
          description: El slug ya existe

  /game-systems/update/{id}:
    post:
      tags: [Game Systems]
      summary: Actualizar sistema de juego
      description: Actualiza parcialmente un sistema de juego. Si se envía `icon`, debe ser una imagen; se redimensiona a 128px si supera ese tamaño. Si se envía `remove_icon` (sin fichero), el icono se elimina.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Pathfinder 2e
                slug:
                  type: string
                  example: pathfinder-2e
                active:
                  type: integer
                  enum: [0, 1]
                  description: 1 activo, 0 inactivo.
                icon:
                  type: string
                  format: binary
                remove_icon:
                  type: string
                  description: Enviar con cualquier valor para eliminar el icono actual.
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema no encontrado
        "409":
          description: El slug ya existe

  /game-systems/{id}/tiers:
    get:
      tags: [Game Systems]
      summary: Listado de tiers de un sistema
      description: Devuelve todos los tiers del sistema indicado por id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: OK
        "404":
          description: Sistema no encontrado

  /game-systems/{id}/tiers/update:
    post:
      tags: [Game Systems]
      summary: Sincronizar tiers de un sistema
      description: |
        Sincroniza los tiers de un sistema en bloque sin perder ids relacionales:
        - Actualiza los tiers que llegan con `id`
        - Crea los tiers que llegan sin `id`
        - Elimina los tiers existentes que no llegan en la petición
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers]
              properties:
                tiers:
                  type: array
                  items:
                    type: object
                    required: [name, min_level, max_level]
                    properties:
                      id:
                        type: integer
                        description: Si se envía, el tier se actualiza; si no, se crea uno nuevo.
                        example: 3
                      name:
                        type: string
                        example: Tier 1
                      min_level:
                        type: integer
                        minimum: 1
                        example: 1
                      max_level:
                        type: integer
                        minimum: 1
                        example: 4
                      active:
                        type: integer
                        enum: [0, 1]
                        default: 1
                        description: 1 activo, 0 inactivo.
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema no encontrado
        "500":
          description: Error interno del servidor

  /game-systems/{id}/setting:
    get:
      tags: [Game Systems]
      summary: Listado de settings de un sistema
      description: Devuelve todos los settings del sistema indicado por id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: OK
        "404":
          description: Sistema no encontrado

  /game-systems/{id}/setting/add:
    post:
      tags: [Game Systems]
      summary: Añadir setting a un sistema
      description: Crea un setting en el sistema indicado por id.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  example: Forgotten Realms
                slug:
                  type: string
                  example: forgotten-realms
                description:
                  type: string
                  example: Ambientación clásica de D&D
                active:
                  type: integer
                  enum: [0, 1]
                  default: 1
                  description: 1 activo, 0 inactivo.
      responses:
        "201":
          description: Setting creado
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema no encontrado
        "409":
          description: El slug ya existe en este sistema

  /game-systems/{id}/setting/{setting_id}/update:
    post:
      tags: [Game Systems]
      summary: Actualizar setting de un sistema
      description: Actualiza parcialmente un setting del sistema indicado.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: setting_id
          in: path
          required: true
          schema:
            type: integer
          example: 4
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                active:
                  type: integer
                  enum: [0, 1]
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema o setting no encontrado
        "409":
          description: El slug ya existe en este sistema

  /game-systems/{id}/setting/{setting_id}/delete:
    delete:
      tags: [Game Systems]
      summary: Eliminar setting de un sistema
      description: Elimina un setting del sistema indicado.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: setting_id
          in: path
          required: true
          schema:
            type: integer
          example: 4
      responses:
        "200":
          description: OK
        "401":
          description: No autorizado
        "404":
          description: Sistema o setting no encontrado

  /game-systems/{id}/species:
    get:
      tags: [Game Systems]
      summary: Listado de especies de un sistema
      description: Devuelve todas las especies del sistema indicado por id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: OK
        "404":
          description: Sistema no encontrado

  /game-systems/{id}/species/add:
    post:
      tags: [Game Systems]
      summary: Añadir especie a un sistema
      description: Crea una especie en el sistema indicado por id.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Elfo
                active:
                  type: integer
                  enum: [0, 1]
                  default: 1
                  description: 1 activo, 0 inactivo.
      responses:
        "201":
          description: Especie creada
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema no encontrado

  /game-systems/{id}/species/{species_id}/update:
    post:
      tags: [Game Systems]
      summary: Actualizar especie de un sistema
      description: Actualiza parcialmente una especie del sistema indicado.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: species_id
          in: path
          required: true
          schema:
            type: integer
          example: 7
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: integer
                  enum: [0, 1]
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema o especie no encontrada

  /game-systems/{id}/species/{species_id}/delete:
    delete:
      tags: [Game Systems]
      summary: Eliminar especie de un sistema
      description: Elimina una especie del sistema indicado.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: species_id
          in: path
          required: true
          schema:
            type: integer
          example: 7
      responses:
        "200":
          description: OK
        "401":
          description: No autorizado
        "404":
          description: Sistema o especie no encontrada

  /game-systems/{id}/class:
    get:
      tags: [Game Systems]
      summary: Listado de clases de un sistema
      description: Devuelve todas las clases del sistema indicado por id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: OK
        "404":
          description: Sistema no encontrado

  /game-systems/{id}/class/add:
    post:
      tags: [Game Systems]
      summary: Añadir clase a un sistema
      description: Crea una clase en el sistema indicado por id.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Guerrero
                active:
                  type: integer
                  enum: [0, 1]
                  default: 1
                  description: 1 activo, 0 inactivo.
      responses:
        "201":
          description: Clase creada
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema no encontrado

  /game-systems/{id}/class/{class_id}/update:
    post:
      tags: [Game Systems]
      summary: Actualizar clase de un sistema
      description: Actualiza parcialmente una clase del sistema indicado.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: class_id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                active:
                  type: integer
                  enum: [0, 1]
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida
        "401":
          description: No autorizado
        "404":
          description: Sistema o clase no encontrada

  /game-systems/{id}/class/{class_id}/delete:
    delete:
      tags: [Game Systems]
      summary: Eliminar clase de un sistema
      description: Elimina una clase del sistema indicado.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
        - name: class_id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        "200":
          description: OK
        "401":
          description: No autorizado
        "404":
          description: Sistema o clase no encontrada

  /login:
    post:
      tags: [Authentication]
      summary: Login con email y contraseña
      description: Autentica al usuario con email y contraseña y devuelve el JWT de la API junto al array `roles`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user, password]
              properties:
                user:
                  type: string
                  example: usuario@dominio.com
                password:
                  type: string
                  example: "********"
      responses:
        "200":
          description: Login correcto

  /login/google:
    get:
      tags: [Authentication]
      summary: Obtener Google Client ID
      description: Devuelve el google_client_id configurado en el servidor.
      responses:
        "200":
          description: OK
    post:
      tags: [Authentication]
      summary: Login con Google
      description: Valida el id_token de Google, crea/recupera el usuario y devuelve JWT de la API junto al array `roles`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  example: eyJhbGciOiJSUzI1NiIs
      responses:
        "200":
          description: Login correcto

  /login/admin:
    post:
      tags: [Authentication]
      summary: Login como admin
      description: Permite a un admin autenticarse como otro usuario y obtener su JWT. Requiere JWT de un usuario con rol `admin` y devuelve `roles` en la respuesta.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
      responses:
        "200":
          description: OK

  /me:
    get:
      tags: [User]
      summary: Usuario autenticado
      description: Devuelve los datos del usuario logeado usando el JWT del header Authorization, incluyendo el array `roles`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /update-settings:
    post:
      tags: [User]
      summary: Actualizar ajustes del usuario autenticado
      description: Actualiza de forma parcial `name`, `password` y/o `avatar` del usuario autenticado. Los tres campos son opcionales, pero la petición debe incluir al menos uno. Si `avatar` supera 256px en ancho o alto, el servidor lo redimensiona manteniendo proporción.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Juan Aventurero
                password:
                  type: string
                  example: "mi_password_segura"
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
        "400":
          description: Petición inválida (sin campos, avatar inválido o datos no válidos)
        "401":
          description: No autorizado
        "500":
          description: Error interno del servidor

  /delete-user:
    delete:
      tags: [User]
      summary: Programar eliminación de cuenta
      description: Programa la eliminación de la cuenta del usuario autenticado estableciendo `delete_on` a 15 días desde la fecha actual. No recibe parámetros.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Eliminación programada correctamente
        "401":
          description: No autorizado
        "500":
          description: Error interno del servidor

  /admin/control-panel:
    get:
      tags: [Admin]
      summary: Panel de control
      description: Devuelve los contadores de usuarios para el panel de navegación y estadísticas básicas del log de ficheros.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /admin/user-list:
    post:
      tags: [Admin]
      summary: Listado de usuarios
      description: Devuelve un listado paginado de usuarios con orden y búsqueda opcional. Cada usuario incluye `roles`.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 20
                order_by:
                  type: string
                  example: date_created
                order_dir:
                  type: string
                  example: desc
                q:
                  type: string
                  example: ""
      responses:
        "200":
          description: OK

  /admin/user/{uid}:
    get:
      tags: [Admin]
      summary: Detalle de usuario
      description: Devuelve los datos de un usuario y su historial de bans. El usuario incluye `roles`.
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: ABC123DEF45
      responses:
        "200":
          description: OK

  /admin/ban-user:
    post:
      tags: [Admin]
      summary: Banear usuario
      description: Registra un ban para un usuario. El campo banned_by se extrae del JWT del admin autenticado y date_start se establece automÃ¡ticamente al recibir la peticiÃ³n.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, permanent, reason]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                permanent:
                  type: integer
                  example: 1
                date_end:
                  type: string
                  example: "2026-05-01 12:00:00"
                reason:
                  type: string
                  example: Incumplimiento de normas
      responses:
        "200":
          description: OK

  /admin/unban/{uid}:
    get:
      tags: [Admin]
      summary: Desbanear usuario
      description: Desbanea a un usuario poniendo todos sus bans activos a permanente=0 y date_end a la fecha-hora actual.
      security:
        - BearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
          example: ABC123DEF45
      responses:
        "200":
          description: OK

  /admin/toggle-admin:
    post:
      tags: [Admin]
      summary: Toggle admin
      description: Activa o desactiva el rol admin de un usuario. No permite modificar tus propios permisos de admin ni activar admin a usuarios no verificados.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, state]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                state:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK

  /admin/toggle-master:
    post:
      tags: [Admin]
      summary: Toggle master
      description: Activa o desactiva el rol master de un usuario. No permite activar master a usuarios no verificados.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, state]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                state:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK

  /admin/toggle-vip:
    post:
      tags: [Admin]
      summary: Toggle vip
      description: Activa o desactiva el rol vip de un usuario.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [uid, state]
              properties:
                uid:
                  type: string
                  example: ABC123DEF45
                state:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK

  /admin/settings/get:
    get:
      tags: [Admin]
      summary: Obtener settings
      description: Devuelve la lista completa de settings del sistema.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK

  /admin/settings/update:
    post:
      tags: [Admin]
      summary: Actualizar setting
      description: Actualiza el valor de una setting existente identificada por su clave.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  example: test
                value:
                  type: string
                  example: abc123
      responses:
        "200":
          description: OK

  /admin/upload-log:
    post:
      tags: [Admin]
      summary: Listado de subidas
      description: Devuelve un listado paginado del log de subidas con orden, búsqueda y filtros opcionales por usuario y rango de fechas.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  example: 1
                per_page:
                  type: integer
                  example: 20
                order_by:
                  type: string
                  example: timestamp
                order_dir:
                  type: string
                  example: desc
                q:
                  type: string
                  example: ""
                user_uid:
                  type: string
                  example: ""
                date_from:
                  type: string
                  description: Fecha mínima del rango en formato YYYY-MM-DD.
                date_to:
                  type: string
                  description: Fecha máxima del rango en formato YYYY-MM-DD.
      responses:
        "200":
          description: OK

  /cron/delete-users-by-request:
    get:
      tags: [Cron]
      summary: Eliminar usuarios con baja programada
